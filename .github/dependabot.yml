version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
    groups:
      npm-patch-and-minor:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
    groups:
      actions-patch-and-minor:
        update-types: [patch, minor]
