name: Espalier maintenance

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: espalier-maintenance
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Espalier / dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.0.0
          cache: npm
      - name: Install the supported npm version
        uses: ./.github/actions/setup-npm
      - name: Install the locked dependency graph
        id: install
        run: npm ci --include=dev
      - name: Audit the production dependency graph
        run: |
          mkdir -p artifacts/dependency-audit
          npm audit --omit=dev --audit-level=high --json > artifacts/dependency-audit/npm-production-audit.json
      - name: Upload the production audit receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-production-audit
          path: artifacts/dependency-audit/npm-production-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Record the informational development dependency audit
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          npm audit --include=dev --json > artifacts/dependency-audit/npm-development-audit.json
          audit_exit=$?
          set -e
          echo "Development dependency audit exit code: ${audit_exit}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the development audit receipt
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-development-audit
          path: artifacts/dependency-audit/npm-development-audit.json
          if-no-files-found: error
          retention-days: 30
