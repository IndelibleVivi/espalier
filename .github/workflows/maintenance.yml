name: Espalier maintenance

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: espalier-maintenance
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Espalier / dependency-audit report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --include=dev
      - name: Record high-severity production dependency findings
        id: audit
        shell: bash
        run: |
          mkdir -p artifacts/dependency-audit
          set +e
          npm audit --omit=dev --audit-level=high --json > artifacts/dependency-audit/npm-audit.json
          audit_exit=$?
          set -e
          echo "exit-code=${audit_exit}" >> "${GITHUB_OUTPUT}"
          echo "npm audit report exit code: ${audit_exit}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the non-blocking audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-production-audit
          path: artifacts/dependency-audit/npm-audit.json
          if-no-files-found: error
          retention-days: 30
